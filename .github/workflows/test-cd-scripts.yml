name: Test CD Scripts

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/scripts/detect_publishable_packages.py'
      - '.github/scripts/test_detect_publishable_packages.py'
      - '.github/scripts/check_version_uniqueness.py'
      - '.github/scripts/test_check_version_uniqueness.py'
      - '.github/scripts/check_dependency_version_bumps.py'
      - '.github/scripts/test_check_dependency_version_bumps.py'
      - '.github/workflows/cd.yml'
      - '.github/workflows/check-version-availability.yml'
      - '.github/workflows/check-dependency-bumps.yml'

permissions:
  contents: read

jobs:
  test-cd-scripts:
    runs-on: uipath-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        working-directory: .github/scripts
        run: python -m pytest test_detect_publishable_packages.py test_check_version_uniqueness.py test_check_dependency_version_bumps.py -v
