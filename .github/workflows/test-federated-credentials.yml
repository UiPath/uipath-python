name: uipath - Federated Credentials

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  federated-login:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: uipath-ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm
    env:
      CLIENT_ID: ${{ secrets.CLOUD_TEST_CLIENT_ID }}
      BASE_URL: ${{ secrets.CLOUD_BASE_URL }}
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    - name: Install dependencies
      working-directory: packages/uipath
      run: uv sync

    - name: Get OIDC token
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
      with:
        script: core.exportVariable('UIPATH_CLIENT_ASSERTION', await core.getIDToken('https://uipath/uipath-python-ci'))

    - name: Log in with uipath auth
      working-directory: packages/uipath
      run: |
        uv run uipath auth --client-id "$CLIENT_ID" --base-url "$BASE_URL"
        set -a && . ./.env && set +a
        uv run python -c "
        import asyncio
        from uipath.platform import UiPath
        result = asyncio.run(UiPath().llm.chat_completions([{'role': 'user', 'content': 'Say ok'}]))
        print('CLI session: LLM replied', result.choices[0].message.content)
        "

    - name: Log in with UiPath(client_assertion=...)
      working-directory: packages/uipath
      env:
        UIPATH_URL: ${{ secrets.CLOUD_BASE_URL }}
      run: |
        rm -f .env
        uv run python -c "
        import asyncio
        import os
        from uipath.platform import UiPath
        sdk = UiPath(base_url=os.environ['BASE_URL'], client_id=os.environ['CLIENT_ID'], client_assertion=os.environ['UIPATH_CLIENT_ASSERTION'])
        result = asyncio.run(sdk.llm.chat_completions([{'role': 'user', 'content': 'Say ok'}]))
        print('SDK: LLM replied', result.choices[0].message.content)
        "
