[project]
name = "ticket-triage-agent"
version = "0.0.1"
description = "Two-tier support ticket triage: a mocked System One model (Jev) for fast structured routing, escalating to Action Center HITL or an LLM-drafted auto-reply."
requires-python = ">=3.11"
dependencies = [
    "uipath",
]

